type Account
  @model
  @searchable
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
    @index(
      name: "accountsByTicketsBought"
      queryField: "accountsByTicketsBought"
      sortKeyFields: ["ticketsBought"]
    )
    @index(
      name: "accountsByRafflesEntered"
      queryField: "accountsByRafflesEntered"
      sortKeyFields: ["rafflesEntered"]
    )
    @index(
      name: "accountsByRafflesWon"
      queryField: "accountsByRafflesWon"
      sortKeyFields: ["rafflesWon"]
    )
    @index(
      name: "accountsByRafflesCreated"
      queryField: "accountsByRafflesCreated"
      sortKeyFields: ["rafflesCreated"]
    )
    @index(
      name: "accountsByUpdatedAt"
      queryField: "accountsByUpdatedAt"
      sortKeyFields: ["updatedAt"]
    )
    @index(
      name: "accountsByCreatedAt"
      queryField: "accountsByCreatedAt"
      sortKeyFields: ["createdAt"]
    )
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  address: String!
  rafflesCreated: Int!
  rafflesWon: Int!
  rafflesEntered: Int!
  ticketsBought: Int!
}