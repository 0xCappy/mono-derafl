type TicketRefund
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  raffleNonce: Int!
  ethAmount: Float
  refundee: String
  chainId: String!
  raffle: Raffle @hasOne
  tx: Transaction @hasOne
}

type Stat
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  ethPaid: Float
  ticketsBought: Int
  royaltiesPaid: Float
  chainId: String!
  rafflesCreated: Int
}

type TicketBatch
  @searchable
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
    @index(
      name: "ticketBatchesByCreatedAt"
      queryField: "ticketBatchesByCreatedAt"
      sortKeyFields: ["createdAt"]
    )
    @index(
      name: "ticketBatchesByUpdatedAt"
      queryField: "ticketBatchesByUpdatedAt"
      sortKeyFields: ["updatedAt"]
    )
    @index(
      name: "ticketBatchesByTicketsBought"
      queryField: "ticketBatchesByTicketsBought"
      sortKeyFields: ["ticketsBought"]
    )
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  raffleNonce: Int!
  lastTicket: Int!
  transaction: Transaction! @hasOne
  purchaser: String!
  ticketsBought: Int!
  batchId: Int!
  firstTicket: Int!
  chainId: String!
  raffle: Raffle! @belongsTo
}

type Transaction
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  raffleNonce: Int!
  date: AWSDateTime!
  eventType: Int!
  hash: String!
  chainId: String!
}

type Raffle
  @model
  @searchable
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: public, provider: iam, operations: [read, create, update] }
    ]
  ) {
  id: ID!
  type: String!
    @index(
      name: "rafflesByCreatedAt"
      queryField: "rafflesByCreatedAt"
      sortKeyFields: ["createdAt"]
    )
    @index(
      name: "rafflesByUpdatedAt"
      queryField: "rafflesByUpdatedAt"
      sortKeyFields: ["updatedAt"]
    )
    @index(
      name: "rafflesByProgress"
      queryField: "rafflesByProgress"
      sortKeyFields: ["progress"]
    )
    @index(
      name: "rafflesByTicketsAvailable"
      queryField: "rafflesByTicketsAvailable"
      sortKeyFields: ["ticketsAvailable"]
    )
    @index(
      name: "rafflesByExpires"
      queryField: "rafflesByExpires"
      sortKeyFields: ["expires"]
    )
    @index(
      name: "rafflesByTicketsSold"
      queryField: "rafflesByTicketsSold"
      sortKeyFields: ["ticketsSold"]
    )
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  raffleNonce: Int!
  ticketsAvailable: Int!
  winningBatch: TicketBatch @hasOne
  releaseTx: Transaction @hasOne
  progress: Float!
  openTx: Transaction @hasOne
  drawnTx: Transaction @hasOne
  state: Int!
  tokenId: String!
  expires: AWSDateTime!
  nftAddress: String!
  ticketsSold: Int!
  ticketBatches: Int
  winningTicket: Int
  closeTx: Transaction @hasOne
  chainId: String!
  winningAccount: String
  owner: String!
  contract: String!
  nft: NFT! @hasOne
  refundTx: Transaction @hasOne
}

